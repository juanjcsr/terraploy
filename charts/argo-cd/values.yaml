argo-cd:
  syncPolicy:
    automated:
      prune: true
      automated: {}
  dex:
    enabled: false
  global:
    domain: argocd.localhost
    deploymentAnnotations:
      linkerd.io/inject: enabled
    podAnnotations:
      linkerd.io/inject: enabled
  notifications:
    enabled: false
  applicationSet:
    enabled: false
  configs:
    params:
      server.insecure: true
  server:
    ingress:
      enabled: true
      ingressClassName: traefik
